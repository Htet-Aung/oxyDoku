name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Production web build
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./oxyDoku.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxyDoku-apk
          path: ./oxyDoku.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0-apk ./oxyDoku.apk --title "oxyDoku Android App" --notes "Direct APK download for Android phone. Download and install oxyDoku.apk directly." || gh release upload v1.0.0-apk ./oxyDoku.apk --clobber
