name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Production web build
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./oxyDoku.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxyDoku-apk
          path: ./oxyDoku.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-latest
          name: oxyDoku Android App (Latest)
          body: |
            Automated Android APK build for oxyDoku.
            
            Download `oxyDoku.apk` below directly to your phone to install!
          draft: false
          prerelease: false
          files: ./oxyDoku.apk
